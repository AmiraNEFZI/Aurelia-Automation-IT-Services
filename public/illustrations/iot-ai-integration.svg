<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" style="background:#0f172a">
  <defs>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1B3A7A;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#2E8B57;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background glow -->
  <circle cx="400" cy="240" r="250" fill="url(#glowBlue)" opacity="0.4"/>

  <!-- Central AI hub -->
  <circle cx="400" cy="240" r="55" fill="#1B3A7A" stroke="#2E8B57" stroke-width="2" filter="url(#glow)"/>
  <circle cx="400" cy="240" r="42" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1" opacity="0.6"/>
  <text x="400" y="235" text-anchor="middle" fill="white" font-family="Arial Black" font-size="13" font-weight="900">AI</text>
  <text x="400" y="252" text-anchor="middle" fill="#2E8B57" font-family="Arial" font-size="9" font-weight="bold">ENGINE</text>
  <!-- Rotating ring -->
  <circle cx="400" cy="240" r="54" fill="none" stroke="#2E8B57" stroke-width="1.5" stroke-dasharray="8,4">
    <animateTransform attributeName="transform" type="rotate" from="0 400 240" to="360 400 240" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- IoT Sensor nodes -->
  <!-- Node 1 — Temperature sensor -->
  <g transform="translate(140,120)">
    <circle r="30" fill="#1e293b" stroke="#2E8B57" stroke-width="1.5"/>
    <text x="0" y="-8" text-anchor="middle" fill="#2E8B57" font-size="18">🌡</text>
    <text x="0" y="10" text-anchor="middle" fill="#94a3b8" font-size="8">TEMP</text>
    <text x="0" y="22" text-anchor="middle" fill="#22c55e" font-size="10" font-weight="bold">82°C</text>
    <circle r="5" cx="28" cy="-26" fill="#22c55e"><animate attributeName="opacity" values="1;0;1" dur="1.4s" repeatCount="indefinite"/></circle>
  </g>
  <line x1="170" y1="120" x2="355" y2="210" stroke="#2E8B57" stroke-width="1" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- Node 2 — Vibration sensor -->
  <g transform="translate(660,100)">
    <circle r="30" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="0" y="-8" text-anchor="middle" fill="#60a5fa" font-size="18">📳</text>
    <text x="0" y="10" text-anchor="middle" fill="#94a3b8" font-size="8">VIBRATION</text>
    <text x="0" y="22" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="bold">0.3g</text>
    <circle r="5" cx="-28" cy="-26" fill="#3b82f6"><animate attributeName="opacity" values="1;0;1" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>
  <line x1="630" y1="100" x2="445" y2="205" stroke="#3b82f6" stroke-width="1" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- Node 3 — Pressure sensor -->
  <g transform="translate(120,360)">
    <circle r="30" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="0" y="-8" text-anchor="middle" fill="#f59e0b" font-size="18">⚡</text>
    <text x="0" y="10" text-anchor="middle" fill="#94a3b8" font-size="8">PRESSURE</text>
    <text x="0" y="22" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="bold">4.2 bar</text>
    <circle r="5" cx="28" cy="26" fill="#f59e0b"><animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/></circle>
  </g>
  <line x1="150" y1="350" x2="355" y2="272" stroke="#f59e0b" stroke-width="1" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- Node 4 — Production counter -->
  <g transform="translate(665,370)">
    <circle r="30" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="0" y="-8" text-anchor="middle" fill="#a78bfa" font-size="18">🏭</text>
    <text x="0" y="10" text-anchor="middle" fill="#94a3b8" font-size="8">OUTPUT</text>
    <text x="0" y="22" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="bold">1,247/h</text>
    <circle r="5" cx="-28" cy="26" fill="#a78bfa"><animate attributeName="opacity" values="1;0;1" dur="1.6s" repeatCount="indefinite"/></circle>
  </g>
  <line x1="635" y1="365" x2="445" y2="272" stroke="#a78bfa" stroke-width="1" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- Decision output panels -->
  <!-- OEE Dashboard -->
  <rect x="260" y="50" width="130" height="65" rx="8" fill="#1e293b" stroke="#1B3A7A" stroke-width="1.5"/>
  <text x="325" y="70" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">OEE SCORE</text>
  <text x="325" y="92" text-anchor="middle" fill="#22c55e" font-family="Arial Black" font-size="22" font-weight="900">94.7%</text>
  <text x="325" y="108" text-anchor="middle" fill="#2E8B57" font-family="Arial" font-size="8">▲ +3.2% this week</text>
  <line x1="325" y1="115" x2="380" y2="185" stroke="#22c55e" stroke-width="1" opacity="0.5" stroke-dasharray="4,3"/>

  <!-- Predictive alert -->
  <rect x="415" y="50" width="130" height="65" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="480" y="70" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">PREDICTIVE ALERT</text>
  <text x="480" y="90" text-anchor="middle" fill="#f59e0b" font-family="Arial" font-size="11" font-weight="bold">Motor 3B</text>
  <text x="480" y="105" text-anchor="middle" fill="#fbbf24" font-family="Arial" font-size="9">Maintenance in 72h</text>
  <line x1="480" y1="115" x2="420" y2="185" stroke="#f59e0b" stroke-width="1" opacity="0.5" stroke-dasharray="4,3"/>

  <!-- Cloud sync -->
  <rect x="335" y="360" width="130" height="60" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="400" y="380" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">CLOUD SYNC</text>
  <text x="400" y="398" text-anchor="middle" fill="#60a5fa" font-family="Arial" font-size="11" font-weight="bold">Azure IoT Hub</text>
  <text x="400" y="412" text-anchor="middle" fill="#2E8B57" font-family="Arial" font-size="8">● Live — 2,847 pts/min</text>
  <line x1="400" y1="360" x2="400" y2="296" stroke="#60a5fa" stroke-width="1" opacity="0.5" stroke-dasharray="4,3"/>

  <!-- Title -->
  <rect x="20" y="20" width="200" height="44" rx="8" fill="#1e293b" stroke="#2E8B57" stroke-width="1"/>
  <text x="120" y="38" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">IoT &amp; AI Integration</text>
  <text x="120" y="54" text-anchor="middle" fill="#2E8B57" font-family="Arial" font-size="9">Smart Factory · Predictive</text>
</svg>
