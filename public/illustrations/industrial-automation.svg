<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0L0 0 0 40" fill="none" stroke="#d1dce8" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="armG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A7A"/>
      <stop offset="100%" stop-color="#2E5FAD"/>
    </linearGradient>
    <linearGradient id="floorG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#grid)"/>

  <!-- Floor -->
  <rect x="0" y="380" width="800" height="100" fill="url(#floorG)"/>
  <rect x="0" y="375" width="800" height="12" fill="#94a3b8"/>

  <!-- Conveyor belt -->
  <rect x="80" y="355" width="640" height="25" rx="4" fill="#64748b"/>
  <rect x="80" y="358" width="640" height="6"  rx="2" fill="#475569"/>
  <!-- Belt segments (16 fixed) -->
  <rect x="90"  y="355" width="2" height="25" fill="#334155" opacity="0.5"/>
  <rect x="130" y="355" width="2" height="25" fill="#334155" opacity="0.5"/>
  <rect x="170" y="355" width="2" height="25" fill="#334155" opacity="0.5"/>
  <rect x="210" y="355" width="2" height="25" fill="#334155" opacity="0.5"/>
  <rect x="250" y="355" width="2" height="25" fill="#334155" opacity="0.5"/>
  <rect x="290" y="355" width="2" height="25" fill="#334155" opacity="0.5"/>
  <rect x="330" y="355" width="2" height="25" fill="#334155" opacity="0.5"/>
  <rect x="370" y="355" width="2" height="25" fill="#334155" opacity="0.5"/>
  <rect x="410" y="355" width="2" height="25" fill="#334155" opacity="0.5"/>
  <rect x="450" y="355" width="2" height="25" fill="#334155" opacity="0.5"/>
  <rect x="490" y="355" width="2" height="25" fill="#334155" opacity="0.5"/>
  <rect x="530" y="355" width="2" height="25" fill="#334155" opacity="0.5"/>
  <rect x="570" y="355" width="2" height="25" fill="#334155" opacity="0.5"/>
  <rect x="610" y="355" width="2" height="25" fill="#334155" opacity="0.5"/>
  <rect x="650" y="355" width="2" height="25" fill="#334155" opacity="0.5"/>
  <rect x="690" y="355" width="2" height="25" fill="#334155" opacity="0.5"/>
  <!-- Wheels -->
  <circle cx="95"  cy="367" r="14" fill="#374151" stroke="#1f2937" stroke-width="2"/>
  <circle cx="95"  cy="367" r="6"  fill="#6b7280"/>
  <circle cx="705" cy="367" r="14" fill="#374151" stroke="#1f2937" stroke-width="2"/>
  <circle cx="705" cy="367" r="6"  fill="#6b7280"/>

  <!-- Robot Arm LEFT -->
  <g transform="translate(195,358)">
    <rect x="-25" y="-10" width="50" height="18" rx="4" fill="#1B3A7A"/>
    <rect x="-20" y="-40" width="40" height="32" rx="3" fill="#2E5FAD"/>
    <rect x="-9" y="-40" width="18" height="88" rx="6" fill="url(#armG)" transform="rotate(-14)"/>
    <rect x="-7" y="-40" width="14" height="78" rx="5" fill="#1B3A7A" transform="rotate(-14) translate(0,-75)"/>
    <circle cx="0" cy="-40" r="12" fill="#1e3a5f" stroke="#2E8B57" stroke-width="2"/>
    <circle cx="-6" cy="-112" r="9" fill="#1e3a5f" stroke="#2E8B57" stroke-width="2"/>
    <rect x="-18" y="-162" width="8" height="20" rx="2" fill="#2E8B57" transform="rotate(-14)"/>
    <rect x="-4"  y="-162" width="8" height="20" rx="2" fill="#2E8B57" transform="rotate(-14)"/>
    <circle cx="0" cy="-38" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Robot Arm RIGHT -->
  <g transform="translate(565,358)">
    <rect x="-25" y="-10" width="50" height="18" rx="4" fill="#1B3A7A"/>
    <rect x="-20" y="-40" width="40" height="32" rx="3" fill="#2E5FAD"/>
    <rect x="-9" y="-40" width="18" height="88" rx="6" fill="url(#armG)" transform="rotate(14)"/>
    <rect x="-7" y="-40" width="14" height="78" rx="5" fill="#1B3A7A" transform="rotate(14) translate(0,-75)"/>
    <circle cx="0" cy="-40" r="12" fill="#1e3a5f" stroke="#2E8B57" stroke-width="2"/>
    <circle cx="6"  cy="-112" r="9" fill="#1e3a5f" stroke="#2E8B57" stroke-width="2"/>
    <rect x="-4"  y="-162" width="8" height="20" rx="2" fill="#2E8B57" transform="rotate(14)"/>
    <rect x="10"  y="-162" width="8" height="20" rx="2" fill="#2E8B57" transform="rotate(14)"/>
    <circle cx="0" cy="-38" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- PLC Controller panel -->
  <rect x="334" y="202" width="132" height="158" rx="8" fill="#1e293b" stroke="#2E8B57" stroke-width="2"/>
  <rect x="344" y="212" width="112" height="74"  rx="4" fill="#0f172a"/>
  <text x="400" y="234" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="11">SYSTEM OK</text>
  <text x="400" y="252" text-anchor="middle" fill="#2E8B57" font-family="monospace" font-size="9">OEE: 94.7%</text>
  <text x="400" y="268" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="9">CYCLE: 2.4s</text>
  <rect x="349" y="276" width="102" height="6" rx="3" fill="#1e3a5f"/>
  <rect x="349" y="276" width="90"  height="6" rx="3" fill="#22c55e"/>
  <circle cx="364" cy="318" r="8" fill="#22c55e"/>
  <circle cx="384" cy="318" r="8" fill="#f59e0b"/>
  <circle cx="404" cy="318" r="8" fill="#ef4444"/>
  <circle cx="424" cy="318" r="8" fill="#3b82f6"/>
  <circle cx="444" cy="318" r="8" fill="#8b5cf6"/>
  <text x="400" y="348" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9" font-weight="bold">PLC CONTROLLER</text>

  <!-- Workpieces -->
  <rect x="248" y="340" width="48" height="18" rx="3" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
  <rect x="348" y="340" width="48" height="18" rx="3" fill="#3b82f6" stroke="#2563eb" stroke-width="1"/>
  <rect x="455" y="340" width="48" height="18" rx="3" fill="#22c55e" stroke="#16a34a" stroke-width="1"/>

  <!-- Signal lines -->
  <line x1="205" y1="282" x2="334" y2="272" stroke="#2E8B57" stroke-width="1" stroke-dasharray="4,3" opacity="0.7"/>
  <line x1="556" y1="282" x2="466" y2="272" stroke="#2E8B57" stroke-width="1" stroke-dasharray="4,3" opacity="0.7"/>

  <!-- Label card -->
  <rect x="18" y="18" width="218" height="46" rx="8" fill="white" opacity="0.95"/>
  <text x="127" y="38" text-anchor="middle" fill="#1B3A7A" font-family="Arial" font-size="13" font-weight="bold">Industrial Automation</text>
  <text x="127" y="56" text-anchor="middle" fill="#2E8B57" font-family="Arial" font-size="10">Robotics · PLCs · SCADA</text>
</svg>
