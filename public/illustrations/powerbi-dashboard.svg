<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" style="background:#f8fafc">
  <defs>
    <linearGradient id="barBlue1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2E5FAD"/>
      <stop offset="100%" style="stop-color:#1B3A7A"/>
    </linearGradient>
    <linearGradient id="barGreen1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="100%" style="stop-color:#2E8B57"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
  </defs>

  <!-- Dashboard background -->
  <rect width="800" height="480" fill="#f1f5f9"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="800" height="52" fill="#1B3A7A"/>
  <text x="24" y="22" fill="white" font-family="Arial Black" font-size="14" font-weight="900">AURELIA</text>
  <text x="24" y="38" fill="#93c5fd" font-family="Arial" font-size="9" letter-spacing="1">INDUSTRIAL PERFORMANCE DASHBOARD</text>
  <!-- Power BI logo area -->
  <rect x="698" y="10" width="82" height="32" rx="4" fill="#f2c811"/>
  <text x="739" y="30" text-anchor="middle" fill="#1B3A7A" font-family="Arial Black" font-size="11" font-weight="900">Power BI</text>

  <!-- KPI Cards row -->
  <!-- KPI 1 -->
  <rect x="20" y="68" width="165" height="78" rx="8" fill="white" filter="url(#shadow)"/>
  <rect x="20" y="68" width="165" height="5" rx="4" fill="#1B3A7A"/>
  <text x="102" y="96" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="10">Overall OEE</text>
  <text x="102" y="122" text-anchor="middle" fill="#1B3A7A" font-family="Arial Black" font-size="26" font-weight="900">94.7%</text>
  <text x="102" y="138" text-anchor="middle" fill="#22c55e" font-family="Arial" font-size="10">▲ +3.2% vs last month</text>

  <!-- KPI 2 -->
  <rect x="198" y="68" width="165" height="78" rx="8" fill="white" filter="url(#shadow)"/>
  <rect x="198" y="68" width="165" height="5" rx="4" fill="#2E8B57"/>
  <text x="280" y="96" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="10">Production Output</text>
  <text x="280" y="122" text-anchor="middle" fill="#1B3A7A" font-family="Arial Black" font-size="26" font-weight="900">12,847</text>
  <text x="280" y="138" text-anchor="middle" fill="#22c55e" font-family="Arial" font-size="10">▲ +8.4% units/day</text>

  <!-- KPI 3 -->
  <rect x="376" y="68" width="165" height="78" rx="8" fill="white" filter="url(#shadow)"/>
  <rect x="376" y="68" width="165" height="5" rx="4" fill="#f59e0b"/>
  <text x="458" y="96" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="10">Downtime Reduced</text>
  <text x="458" y="122" text-anchor="middle" fill="#1B3A7A" font-family="Arial Black" font-size="26" font-weight="900">−45%</text>
  <text x="458" y="138" text-anchor="middle" fill="#22c55e" font-family="Arial" font-size="10">▲ Since automation</text>

  <!-- KPI 4 -->
  <rect x="554" y="68" width="226" height="78" rx="8" fill="#1B3A7A" filter="url(#shadow)"/>
  <text x="667" y="96" text-anchor="middle" fill="#93c5fd" font-family="Arial" font-size="10">Energy Efficiency</text>
  <text x="667" y="122" text-anchor="middle" fill="white" font-family="Arial Black" font-size="26" font-weight="900">−28%</text>
  <text x="667" y="138" text-anchor="middle" fill="#2E8B57" font-family="Arial" font-size="10" fill="#86efac">▲ kWh/unit saved</text>

  <!-- Bar chart — Production by line -->
  <rect x="20" y="162" width="380" height="200" rx="8" fill="white" filter="url(#shadow)"/>
  <text x="36" y="184" fill="#334155" font-family="Arial" font-size="11" font-weight="bold">Production by Line</text>
  <!-- Axes -->
  <line x1="60" y1="195" x2="60" y2="345" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="60" y1="345" x2="380" y2="345" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Bars -->
  <rect x="80"  y="245" width="32" height="100" rx="3" fill="url(#barBlue1)"/>
  <rect x="130" y="225" width="32" height="120" rx="3" fill="url(#barGreen1)"/>
  <rect x="180" y="260" width="32" height="85"  rx="3" fill="url(#barBlue1)"/>
  <rect x="230" y="200" width="32" height="145" rx="3" fill="url(#barGreen1)"/>
  <rect x="280" y="235" width="32" height="110" rx="3" fill="url(#barBlue1)"/>
  <rect x="330" y="215" width="32" height="130" rx="3" fill="url(#barGreen1)"/>
  <!-- X labels -->
  <text x="96"  y="358" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">Line A</text>
  <text x="146" y="358" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">Line B</text>
  <text x="196" y="358" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">Line C</text>
  <text x="246" y="358" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">Line D</text>
  <text x="296" y="358" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">Line E</text>
  <text x="346" y="358" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">Line F</text>

  <!-- Line chart — OEE trend -->
  <rect x="416" y="162" width="364" height="200" rx="8" fill="white" filter="url(#shadow)"/>
  <text x="432" y="184" fill="#334155" font-family="Arial" font-size="11" font-weight="bold">OEE Trend — 6 Months</text>
  <polyline points="450,330 490,310 540,295 590,275 640,255 690,240 740,220" fill="none" stroke="#1B3A7A" stroke-width="2.5" stroke-linejoin="round"/>
  <polyline points="450,330 490,310 540,295 590,275 640,255 690,240 740,220" fill="url(#barBlue1)" fill-opacity="0.12"/>
  <!-- Data points -->
  <circle cx="450" cy="330" r="4" fill="#1B3A7A"/>
  <circle cx="490" cy="310" r="4" fill="#1B3A7A"/>
  <circle cx="540" cy="295" r="4" fill="#1B3A7A"/>
  <circle cx="590" cy="275" r="4" fill="#1B3A7A"/>
  <circle cx="640" cy="255" r="4" fill="#1B3A7A"/>
  <circle cx="690" cy="240" r="4" fill="#2E8B57"/>
  <circle cx="740" cy="220" r="5" fill="#2E8B57" stroke="white" stroke-width="2"/>
  <!-- Month labels -->
  <text x="450" y="360" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">Jan</text>
  <text x="490" y="360" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">Feb</text>
  <text x="540" y="360" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">Mar</text>
  <text x="590" y="360" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">Apr</text>
  <text x="640" y="360" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">May</text>
  <text x="690" y="360" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">Jun</text>
  <text x="740" y="360" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">Jul</text>

  <!-- Donut chart — Machine availability -->
  <rect x="20" y="378" width="380" height="88" rx="8" fill="white" filter="url(#shadow)"/>
  <text x="36" y="398" fill="#334155" font-family="Arial" font-size="11" font-weight="bold">Machine Availability</text>
  <circle cx="80" cy="428" r="26" fill="none" stroke="#e2e8f0" stroke-width="12"/>
  <circle cx="80" cy="428" r="26" fill="none" stroke="#1B3A7A" stroke-width="12" stroke-dasharray="146 163" stroke-dashoffset="0" transform="rotate(-90 80 428)"/>
  <circle cx="80" cy="428" r="26" fill="none" stroke="#2E8B57" stroke-width="12" stroke-dasharray="17 163" stroke-dashoffset="-146" transform="rotate(-90 80 428)"/>
  <text x="80" y="432" text-anchor="middle" fill="#1B3A7A" font-family="Arial Black" font-size="11" font-weight="900">89%</text>
  <text x="160" y="418" fill="#1B3A7A" font-size="10">■ Available: 89%</text>
  <text x="160" y="435" fill="#2E8B57" font-size="10">■ Maintenance: 7%</text>
  <text x="160" y="452" fill="#f59e0b" font-size="10">■ Breakdown: 4%</text>

  <!-- Alert table -->
  <rect x="416" y="378" width="364" height="88" rx="8" fill="white" filter="url(#shadow)"/>
  <text x="432" y="398" fill="#334155" font-family="Arial" font-size="11" font-weight="bold">Active Alerts</text>
  <rect x="430" y="404" width="340" height="18" rx="3" fill="#fef9c3"/>
  <text x="438" y="417" fill="#92400e" font-family="Arial" font-size="9">⚠ Motor 3B — Predictive maintenance due in 72h</text>
  <rect x="430" y="425" width="340" height="18" rx="3" fill="#dcfce7"/>
  <text x="438" y="438" fill="#166534" font-family="Arial" font-size="9">✓ Line D — OEE target exceeded (+4.2%)</text>
  <rect x="430" y="446" width="340" height="16" rx="3" fill="#dbeafe"/>
  <text x="438" y="458" fill="#1e40af" font-family="Arial" font-size="9">ℹ Shift report ready — Line A, B, C</text>
</svg>
