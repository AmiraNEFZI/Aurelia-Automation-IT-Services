<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" style="background:#f0f4f8">
  <!-- Background grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#d1dce8" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="armGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B3A7A"/>
      <stop offset="100%" style="stop-color:#2E5FAD"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#cbd5e1"/>
      <stop offset="100%" style="stop-color:#94a3b8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#grid)"/>

  <!-- Factory floor -->
  <rect x="0" y="380" width="800" height="100" fill="url(#floorGrad)" rx="0"/>
  <rect x="0" y="375" width="800" height="12" fill="#94a3b8" rx="0"/>

  <!-- Conveyor belt -->
  <rect x="80" y="355" width="640" height="25" rx="4" fill="#64748b"/>
  <rect x="80" y="358" width="640" height="6" rx="2" fill="#475569"/>
  <!-- Belt segments -->
  {Array.from({length:16}).map((_, i) => `<rect x="${90+i*40}" y="355" width="2" height="25" fill="#334155" opacity="0.5"/>`).join('')}
  <!-- Conveyor wheels -->
  <circle cx="95"  cy="367" r="14" fill="#374151" stroke="#1f2937" stroke-width="2"/>
  <circle cx="95"  cy="367" r="6"  fill="#6b7280"/>
  <circle cx="705" cy="367" r="14" fill="#374151" stroke="#1f2937" stroke-width="2"/>
  <circle cx="705" cy="367" r="6"  fill="#6b7280"/>

  <!-- Industrial Robot Arm LEFT -->
  <g transform="translate(180,360)">
    <!-- Base -->
    <rect x="-25" y="-10" width="50" height="18" rx="4" fill="#1B3A7A"/>
    <rect x="-20" y="-40" width="40" height="32" rx="3" fill="#2E5FAD"/>
    <!-- Arm segments -->
    <rect x="-10" y="-130" width="20" height="95" rx="6" fill="url(#armGrad)" transform="rotate(-15)"/>
    <rect x="-8" y="-210" width="16" height="85" rx="5" fill="#1B3A7A" transform="rotate(-15) translate(0,-90)"/>
    <!-- Joint circles -->
    <circle cx="0" cy="-40" r="12" fill="#1e3a5f" stroke="#2E8B57" stroke-width="2"/>
    <circle cx="-8" cy="-120" r="9" fill="#1e3a5f" stroke="#2E8B57" stroke-width="2"/>
    <!-- End effector / gripper -->
    <g transform="translate(-12,-175) rotate(-15)">
      <rect x="0" y="0" width="8" height="20" rx="2" fill="#2E8B57"/>
      <rect x="16" y="0" width="8" height="20" rx="2" fill="#2E8B57"/>
      <rect x="4" y="-6" width="16" height="8" rx="2" fill="#1B3A7A"/>
    </g>
    <!-- Indicator light -->
    <circle cx="0" cy="-38" r="4" fill="#22c55e" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Industrial Robot Arm RIGHT -->
  <g transform="translate(560,360)">
    <rect x="-25" y="-10" width="50" height="18" rx="4" fill="#1B3A7A"/>
    <rect x="-20" y="-40" width="40" height="32" rx="3" fill="#2E5FAD"/>
    <rect x="-10" y="-130" width="20" height="95" rx="6" fill="url(#armGrad)" transform="rotate(15)"/>
    <rect x="-8" y="-210" width="16" height="85" rx="5" fill="#1B3A7A" transform="rotate(15) translate(0,-90)"/>
    <circle cx="0" cy="-40" r="12" fill="#1e3a5f" stroke="#2E8B57" stroke-width="2"/>
    <circle cx="8" cy="-120" r="9"  fill="#1e3a5f" stroke="#2E8B57" stroke-width="2"/>
    <g transform="translate(4,-175) rotate(15)">
      <rect x="0" y="0" width="8" height="20" rx="2" fill="#2E8B57"/>
      <rect x="16" y="0" width="8" height="20" rx="2" fill="#2E8B57"/>
      <rect x="4" y="-6" width="16" height="8" rx="2" fill="#1B3A7A"/>
    </g>
    <circle cx="0" cy="-38" r="4" fill="#22c55e" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- PLC / Control Panel -->
  <rect x="330" y="200" width="140" height="160" rx="8" fill="#1e293b" stroke="#2E8B57" stroke-width="2"/>
  <rect x="340" y="210" width="120" height="80" rx="4" fill="#0f172a"/>
  <!-- Screen content -->
  <text x="400" y="235" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="11">SYSTEM OK</text>
  <text x="400" y="252" text-anchor="middle" fill="#2E8B57" font-family="monospace" font-size="9">OEE: 94.7%</text>
  <text x="400" y="268" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="9">CYCLE: 2.4s</text>
  <!-- Status bars -->
  <rect x="345" y="278" width="110" height="6" rx="3" fill="#1e3a5f"/>
  <rect x="345" y="278" width="98"  height="6" rx="3" fill="#22c55e"/>
  <!-- Buttons -->
  <circle cx="360" cy="320" r="8" fill="#22c55e"/>
  <circle cx="380" cy="320" r="8" fill="#f59e0b"/>
  <circle cx="400" cy="320" r="8" fill="#ef4444"/>
  <circle cx="420" cy="320" r="8" fill="#3b82f6"/>
  <circle cx="440" cy="320" r="8" fill="#8b5cf6"/>
  <!-- Label -->
  <text x="400" y="350" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="10" font-weight="bold">PLC CONTROLLER</text>

  <!-- Workpieces on belt -->
  <rect x="240" y="340" width="50" height="20" rx="3" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
  <rect x="340" y="340" width="50" height="20" rx="3" fill="#3b82f6" stroke="#2563eb" stroke-width="1"/>
  <rect x="450" y="340" width="50" height="20" rx="3" fill="#22c55e" stroke="#16a34a" stroke-width="1"/>

  <!-- SCADA signal lines -->
  <line x1="190" y1="280" x2="330" y2="270" stroke="#2E8B57" stroke-width="1" stroke-dasharray="4,3" opacity="0.7"/>
  <line x1="565" y1="280" x2="470" y2="270" stroke="#2E8B57" stroke-width="1" stroke-dasharray="4,3" opacity="0.7"/>

  <!-- Title label -->
  <rect x="20" y="20" width="220" height="44" rx="8" fill="white" opacity="0.9"/>
  <text x="130" y="39" text-anchor="middle" fill="#1B3A7A" font-family="Arial" font-size="13" font-weight="bold">Industrial Automation</text>
  <text x="130" y="56" text-anchor="middle" fill="#2E8B57" font-family="Arial" font-size="10">Robotics · PLCs · SCADA</text>
</svg>
